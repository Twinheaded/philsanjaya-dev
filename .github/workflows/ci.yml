# CI gate (PHI-48): a red run blocks milestone review.
# Deploy hardening (PHI-155): build-and-test runs on every branch push with
# no secrets and hands its dist/ to deploy as an artifact. deploy runs only
# for main, installs with install scripts disabled, never rebuilds, and gives
# the Cloudflare token to its final step only. main is protected by a ruleset
# that requires the build-and-test check, so the routine is: push the branch,
# wait for green, then fast-forward main to that same commit.
# Push routine and the ruleset tests behind it: Linear PHI-155.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Deploys the exact dist/ that build-and-test produced (PHI-28, PHI-155).
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Installs the lockfile's wrangler. No dependency install script runs.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: ./node_modules/.bin/wrangler --version
      # The only step that can read the token. It calls the locked binary
      # directly, so nothing is fetched from npm at deploy time.
      - name: Deploy dist/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 904d250aff49b9fb7673433563d80207
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name=philsanjaya-dev --branch=main --commit-hash="$GITHUB_SHA"
